name: E2E Theme Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Palette, Structure & Syntax E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validator dependencies
        run: sudo apt-get update && sudo apt-get install -y zsh lua5.4

      - name: Run Tier 1 Structure, Format & Palette Contract E2E Suite
        run: |
          mkdir -p ~/.config/nvim/colors
          cp neovim/colors/911.lua ~/.config/nvim/colors/911.lua
          python3 tests/run_e2e.py --tier 1
          PYTHONPATH=tests python3 -m unittest -v test_tier2_boundaries.TestTier2PaletteContract
