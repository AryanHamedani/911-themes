# 911 (992.2) Precision Night Cockpit — Starship
# Race-Tex Charcoal (#141619), Ice Grey (#dadad6), Guards/Carmine Red (#e55c5a)
#
# Layout:
#   Line 1 (context):   [ssh] directory  git (branch · state · status · metrics)  runtimes  infra
#   Line 2 (input):     ❯ <command>                                     [status] [duration] [jobs] HH:MM
#
# Accent discipline (90/9/1):
#   Guards Red (#e55c5a) is reserved strictly for instrument-needle alerts:
#   failed prompt character, non-zero exit status, merge conflicts, and production k8s contexts.

"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 300
palette = "911"

format = """\
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$git_metrics\
$python\
$golang\
$rust\
$nodejs\
$docker_context\
$kubernetes\
$line_break\
$character"""

right_format = """\
$status\
$cmd_duration\
$jobs\
$time"""

# ---------------------------------------------------------------------------
# Prompt Character (Line 2 Left)
# ---------------------------------------------------------------------------
[character]
success_symbol = "[❯](bold bright_foreground)"
error_symbol = "[✗](bold accent)"
vimcmd_symbol = "[❮](bold yellow)"
vimcmd_replace_one_symbol = "[❮](bold magenta)"
vimcmd_replace_symbol = "[❮](bold magenta)"
vimcmd_visual_symbol = "[❮](bold cyan)"

# ---------------------------------------------------------------------------
# Remote Session Context (SSH only — silent locally)
# ---------------------------------------------------------------------------
[username]
show_always = false
style_user = "light_foreground"
style_root = "bold accent"
format = "[$user]($style)[@](muted)"

[hostname]
ssh_only = true
ssh_symbol = ""
style = "cyan"
format = "[$hostname]($style)[ ](muted)"

# ---------------------------------------------------------------------------
# Directory (Primary Focal Point)
# ---------------------------------------------------------------------------
[directory]
style = "bold bright_foreground"
truncation_length = 2
truncation_symbol = "…/"
truncate_to_repo = true
repo_root_style = "bold bright_foreground"
before_repo_root_style = "dark_foreground"
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path](light_foreground)[$read_only]($read_only_style) "
read_only = " 󰌾"
read_only_style = "red"

# ---------------------------------------------------------------------------
# Git Telemetry (Branch · State · Semantic Status · Diff Metrics)
# ---------------------------------------------------------------------------
[git_branch]
symbol = " "
truncation_length = 36
truncation_symbol = "…"
style = "italic cyan"
format = "[$symbol](dark_foreground)[$branch(:$remote_branch)]($style) "

[git_state]
style = "bold orange"
format = "[\\(](muted)[$state( $progress_current/$progress_total)]($style)[\\)](muted) "

[git_status]
format = """(\
[$conflicted](bold accent)\
[$staged](green)\
[$modified](yellow)\
[$renamed](cyan)\
[$deleted](red)\
[$untracked](dark_foreground)\
[$stashed](magenta)\
[$ahead_behind](blue)\
)"""
conflicted = "${count} "
staged = "+${count} "
modified = "${count} "
renamed = "»${count} "
deleted = "✘${count} "
untracked = "?${count} "
stashed = "≡${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""

[git_metrics]
disabled = false
added_style = "green"
deleted_style = "red"
format = "([+$added]($added_style) )([-$deleted]($deleted_style) )"

# ---------------------------------------------------------------------------
# Languages & Runtimes (Secondary Plane: pinpoint semantic icon + calm text)
# ---------------------------------------------------------------------------
[python]
symbol = " "
style = "light_foreground"
detect_files = ["pyproject.toml", "uv.lock", "requirements.txt", "setup.py", "Pipfile", "manage.py", ".python-version"]
format = '([$symbol](yellow)[${pyenv_prefix}${version}]($style)([ \($virtualenv\)](dark_foreground)) )'

[golang]
symbol = " "
style = "light_foreground"
format = "([$symbol](cyan)[$version]($style) )"

[rust]
symbol = " "
style = "light_foreground"
format = "([$symbol](orange)[$version]($style) )"

[nodejs]
symbol = " "
style = "light_foreground"
format = "([$symbol](green)[$version]($style) )"

# ---------------------------------------------------------------------------
# Containers & Kubernetes (Context-aware; Guards Red on prod clusters)
# ---------------------------------------------------------------------------
[docker_context]
symbol = " "
only_with_files = true
style = "light_foreground"
format = "([$symbol](blue)[$context]($style) )"

[kubernetes]
disabled = false
symbol = "󱃾 "
style = "blue"
detect_env_vars = ["KUBECONFIG", "KUBE_CONTEXT"]
detect_files = ["Chart.yaml", "kustomization.yaml", "kustomization.yml", "skaffold.yaml", "helmfile.yaml", "Tiltfile"]
detect_folders = ["k8s", "kubernetes", "helm", "charts", "deploy", "gitops", "manifests", "argocd", "infra"]
format = '[$symbol$context]($style)([ \($namespace\)](dark_foreground)) '

[[kubernetes.contexts]]
context_pattern = "(idk-c8|.*prod.*|.*darkube.*)"
style = "bold accent"

[[kubernetes.contexts]]
context_pattern = "(.*stag.*|.*qa.*)"
style = "yellow"

[[kubernetes.contexts]]
context_pattern = "(.*dev.*|.*local.*|kind-.*|minikube)"
style = "cyan"

# ---------------------------------------------------------------------------
# Right-Side Cockpit Telemetry (Line 2 Right — uncluttered input line)
# ---------------------------------------------------------------------------
[status]
disabled = false
map_symbol = true
symbol = "✗ "
sigint_symbol = "⚡ "
signal_symbol = "⚡ "
not_found_symbol = "∅ "
style = "bold accent"
format = "[$symbol$status]($style) "

[cmd_duration]
min_time = 2000
show_milliseconds = false
style = "orange"
format = "[⏱ $duration]($style) "

[jobs]
symbol = "✦"
number_threshold = 1
style = "cyan"
format = "[$symbol$number]($style) "

[time]
disabled = false
time_format = "%H:%M"
style = "muted"
format = "[$time]($style)"

# ---------------------------------------------------------------------------
# 911 (992.2) Precision Night Cockpit Palette
# ---------------------------------------------------------------------------
[palettes.911]
# Base cockpit surfaces
darker_background = "#0a0b0d"
dark_background = "#0f1114"
background = "#141619"
lighter_background = "#1d2026"
selection = "#292d36"

# Derived cockpit planes, borders & badges
deep_carbon = "#0c0e11"
chrome = "#131519"
elevated = "#1a1d23"
smoked_carmine = "#261b1f"
hairline = "#252932"
divider = "#2f3440"
border = "#434854"
badge_red = "#bf3b3e"
badge_muted = "#363b47"
badge_ink = "#f4f3ef"

# Foregrounds (5-step typographic hierarchy)
bright_foreground = "#edede9"
foreground = "#dadad6"
light_foreground = "#b4b7be"
dark_foreground = "#9297a2"
muted = "#858a96"

# Accent & semantic hues
accent = "#e55c5a"
red = "#e56c6a"
orange = "#e89158"
yellow = "#e0be66"
green = "#7fb887"
cyan = "#6ac4cb"
blue = "#6fa2de"
magenta = "#b488cc"
brown = "#ad7f66"

# Bright semantic hues
bright_red = "#f48583"
bright_yellow = "#f0d282"
bright_green = "#98ce9f"
bright_cyan = "#84d8de"
bright_blue = "#8cb9f2"
bright_magenta = "#caa2e0"
