# Carrera v2.0.0 — Heritage Cockpit palette for Starship
# Basalt Alcantara (#15171a), Chalk (#d6d2c7), Carmine Red (#e1656c)

add_newline = true
command_timeout = 200
palette = "carrera"

format = "$directory$git_branch$git_status$python$golang$rust$nodejs$docker_context$kubernetes$cmd_duration$jobs$status$character"

[character]
success_symbol = "[❯](bold accent)"
error_symbol = "[✗](bold red)"
vimcmd_symbol = "[❮](bold yellow)"

[directory]
style = "bold blue"
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold accent"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
read_only_style = "red"

[git_branch]
format = "[$branch]($style) "
style = "italic green"

[git_status]
format = "[$all_status]($style)"
style = "yellow"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""

[cmd_duration]
style = "orange"

[jobs]
style = "cyan"

[python]
style = "yellow"

[golang]
style = "cyan"

[rust]
style = "orange"

[nodejs]
style = "green"

[docker_context]
style = "blue"

[kubernetes]
style = "blue"

[status]
disabled = false
style = "bold red"

[palettes.carrera]
background = "#15171a"
dark_background = "#101215"
darker_background = "#0b0c0e"
lighter_background = "#1e2025"
selection = "#2b2e35"
foreground = "#d6d2c7"
bright_foreground = "#eae6dc"
light_foreground = "#b3afa6"
dark_foreground = "#9599a2"
muted = "#838792"
accent = "#e1656c"
red = "#e07476"
orange = "#e8965a"
yellow = "#dcbb6a"
green = "#89b87f"
cyan = "#6fc7cb"
blue = "#74a0d7"
magenta = "#b886b8"
brown = "#ae7e62"
bright_red = "#f28a8b"
bright_yellow = "#edcf86"
bright_green = "#a1ce97"
bright_cyan = "#87d9dd"
bright_blue = "#8eb9f0"
bright_magenta = "#d09fd1"
