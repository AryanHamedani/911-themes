# 911 (992.2) Precision Night Cockpit skin for K9s
# Cockpit surfaces (#141619, #0f1114, #1d2026, #292d36), borders (#434854, #e55c5a),
# and Guards Red filled badges (#bf3b3e + #f4f3ef).
k9s:
  body:
    fgColor: "#dadad6"
    bgColor: "#141619"
    logoColor: "#e55c5a"
    logoColorMsg: "#edede9"
    logoColorInfo: "#7fb887"
    logoColorWarn: "#e0be66"
    logoColorError: "#e56c6a"
  prompt:
    fgColor: "#dadad6"
    bgColor: "#0f1114"
    suggestColor: "#6fa2de"
    border:
      command: "#e55c5a"
      default: "#434854"
  help:
    fgColor: "#dadad6"
    bgColor: "#141619"
    sectionColor: "#e55c5a"
    keyColor: "#6fa2de"
    numKeyColor: "#e0be66"
  info:
    fgColor: "#dadad6"
    sectionColor: "#e55c5a"
    cpuColor: "#7fb887"
    memColor: "#6ac4cb"
    k9sRevColor: "#6fa2de"
  dialog:
    fgColor: "#dadad6"
    bgColor: "#1d2026"
    buttonFgColor: "#dadad6"
    buttonBgColor: "#292d36"
    buttonFocusFgColor: "#f4f3ef"
    buttonFocusBgColor: "#bf3b3e"
    labelFgColor: "#e0be66"
    fieldFgColor: "#edede9"
  frame:
    border:
      fgColor: "#434854"
      focusColor: "#e55c5a"
    menu:
      fgColor: "#dadad6"
      keyColor: "#e55c5a"
      numKeyColor: "#e0be66"
    crumbs:
      fgColor: "#0a0b0d"
      bgColor: "#6fa2de"
      activeColor: "#e55c5a"
    status:
      newColor: "#6ac4cb"
      modifyColor: "#6fa2de"
      addColor: "#7fb887"
      pendingColor: "#e89158"
      errorColor: "#e56c6a"
      highlightColor: "#e0be66"
      killColor: "#858a96"
      completedColor: "#858a96"
    title:
      fgColor: "#edede9"
      bgColor: "#141619"
      highlightColor: "#e55c5a"
      counterColor: "#e0be66"
      filterColor: "#6ac4cb"
  views:
    charts:
      bgColor: "#141619"
      dialBgColor: "#1d2026"
      chartBgColor: "#141619"
      defaultDialColors:
        - "#6fa2de"
        - "#e55c5a"
      defaultChartColors:
        - "#6fa2de"
        - "#e55c5a"
      focusFgColor: "#f4f3ef"
      focusBgColor: "#bf3b3e"
      resourceColors:
        cpu:
          - "#7fb887"
          - "#6fa2de"
        mem:
          - "#e0be66"
          - "#e55c5a"
    table:
      fgColor: "#dadad6"
      bgColor: "#141619"
      cursorFgColor: "#edede9"
      cursorBgColor: "#292d36"
      markColor: "#e0be66"
      header:
        fgColor: "#9297a2"
        bgColor: "#141619"
        sorterColor: "#e55c5a"
        selectedSortColumnColor: "#edede9"
    xray:
      fgColor: "#dadad6"
      bgColor: "#141619"
      cursorColor: "#292d36"
      cursorTextColor: "#edede9"
      graphicColor: "#6fa2de"
    yaml:
      keyColor: "#6fa2de"
      colonColor: "#858a96"
      valueColor: "#dadad6"
    picker:
      mainColor: "#dadad6"
      focusColor: "#e55c5a"
      shortcutColor: "#6ac4cb"
    logs:
      fgColor: "#dadad6"
      bgColor: "#141619"
      indicator:
        fgColor: "#edede9"
        bgColor: "#1d2026"
        toggleOnColor: "#7fb887"
        toggleOffColor: "#858a96"
