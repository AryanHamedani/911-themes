; 911 (992.2) Precision Night Cockpit — distraction-free lightbox for imv
; Merge this [options] section into ~/.config/imv/config (imv colors omit #)
; Press `d` inside imv to toggle the bottom telemetry overlay on or off.

[options]
; Canvas — Race-Tex Charcoal (glare-free neutral dark lightbox surface)
background = 141619

; Viewport & scaling — crisp 1:1 for small assets, fit-to-window for large images
scaling_mode = shrink
upscaling_method = linear
initial_pan = 50 50
loop_input = true

; Telemetry HUD — Recessed Carbon float (90% opacity) with Ice Grey dial text
overlay = true
overlay_position_bottom = true
overlay_font = JetBrains Mono:12
overlay_text = $(basename "$imv_current_file")  ·  $imv_current_index/$imv_file_count  ·  ${imv_width}×${imv_height}  ·  ${imv_scale}%
overlay_text_color = dadad6
overlay_text_alpha = ff
overlay_background_color = 0f1114
overlay_background_alpha = e6

; Window title — mirrors telemetry when the overlay is hidden
title_text = imv — $(basename "$imv_current_file") · $imv_current_index/$imv_file_count · ${imv_width}×${imv_height} · ${imv_scale}%
