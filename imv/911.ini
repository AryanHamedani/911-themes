; 911 (992.2) Precision Night Cockpit theme for imv
; Merge this [options] section into ~/.config/imv/config (imv colors omit #)

[options]
background = 141619
overlay = true
overlay_position_bottom = true
overlay_font = JetBrains Mono:13
overlay_text = $(basename "$imv_current_file")  [$imv_current_index/$imv_file_count]  [${imv_width}x${imv_height}]  [${imv_scale}%]
overlay_text_color = dadad6
overlay_text_alpha = ff
overlay_background_color = 0f1114
overlay_background_alpha = e6
scaling_mode = shrink
upscaling_method = linear
