# 911 (992.2) Precision Night Cockpit for kubecolor
preset: dark

theme:
  default: "#7fb887"
  base:
    info: "#dadad6"
    primary: "#b488cc"
    secondary: "#6ac4cb"
    success: "#7fb887"
    warning: "#e0be66"
    danger: "#e56c6a"
    muted: "#858a96:italic"
    key: "#6fa2de / #6ac4cb"
  data:
    key: "#6fa2de / #6ac4cb"
    string: "#f0d282"
    true: "#7fb887"
    false: "#e56c6a"
    number: "#e89158"
    "null": "#858a96:italic"
    quantity: "#e89158"
    duration: "#9297a2"
    durationfresh: "#7fb887 / #e0be66 / #e56c6a"
    ratio:
      zero: "#858a96"
      equal: "#7fb887"
      unequal: "#e0be66"
  status:
    success: "#7fb887"
    warning: "#e0be66"
    error: "#e56c6a:bold"
  table:
    header: "#edede9:bold"
    columns: "#6fa2de / #6ac4cb / #dadad6 / #e0be66 / #b488cc"
  describe:
    key: "#6fa2de / #6ac4cb"
  explain:
    key: "#6fa2de / #6ac4cb"
    required: "#e55c5a:bold"
  version:
    key: "#6fa2de / #6ac4cb"
  stderr:
    error: "#e56c6a:bold"
    nonefound: "#858a96"
    nonefoundnamespace: "#6ac4cb"
  options:
    flag: "#6ac4cb"
  help:
    header: "#e55c5a:bold"
    flag: "#6ac4cb"
    flagdesc: "#dadad6"
    url: "#6fa2de:underline"
    text: "#dadad6"
  apply:
    created: "#7fb887"
    configured: "#e0be66"
    unchanged: "#b488cc"
    serverside: "#e89158"
    pruned: "#e56c6a"
    setlastapplied: "#858a96"
    dryrun: "#6ac4cb"
    fallback: "#7fb887"
  delete:
    deleted: "#e56c6a"
    dryrun: "#6ac4cb"
    fallback: "#e56c6a"
  diff:
    added: "#7fb887"
    removed: "#e56c6a"
    unchanged: "#858a96"
  logs:
    key: "#6fa2de / #6ac4cb"
    quotedstring: "#7fb887"
    date: "#858a96"
    sourceref: "#858a96"
    guid: "#858a96"
    severity:
      trace: "#858a96"
      debug: "#9297a2"
      info: "#7fb887"
      warn: "#e0be66"
      error: "#e56c6a"
      fatal: "#f48583:bold"
      panic: "#f48583:bold"
