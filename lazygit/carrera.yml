# Carrera v2.0.0 (Porsche 911 Heritage Cockpit) for Lazygit
# inactiveBorderColor uses #31353f (shared btop.theme div_line over #15171a).
gui:
  theme:
    activeBorderColor:
      - "#e1656c"
      - bold
    inactiveBorderColor:
      - "#31353f"
    searchingActiveBorderColor:
      - "#dcbb6a"
      - bold
    optionsTextColor:
      - "#74a0d7"
    selectedLineFgColor:
      - "#eae6dc"
    selectedLineBgColor:
      - "#2b2e35"
    inactiveViewSelectedLineBgColor:
      - "#1e2025"
    cherryPickedCommitFgColor:
      - "#0b0c0e"
    cherryPickedCommitBgColor:
      - "#6fc7cb"
    markedBaseCommitFgColor:
      - "#0b0c0e"
    markedBaseCommitBgColor:
      - "#dcbb6a"
    unstagedChangesColor:
      - "#e07476"
    defaultFgColor:
      - "#d6d2c7"
    authorColors:
      "*": "#74a0d7"
    branchColorPatterns:
      "^main$": "#e1656c"
      "^master$": "#e1656c"
