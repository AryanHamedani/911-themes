# Carrera v2.0.0 — Heritage Cockpit palette for Alacritty
# Basalt Alcantara (#15171a), Chalk (#d6d2c7), Carmine Red (#e1656c)

[colors.primary]
background = "#15171a"
foreground = "#d6d2c7"
dim_foreground = "#9599a2"
bright_foreground = "#eae6dc"

# Carmine Red cursor with Basalt text (Omarchy runtime templates use Chalk #eae6dc)
[colors.cursor]
