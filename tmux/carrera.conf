# Carrera v2.0.0 — Heritage Cockpit palette for tmux
# Basalt Alcantara (#15171a), Chalk (#d6d2c7), Carmine Red (#e1656c)
# Requires truecolor (24-bit RGB) support in your terminal / tmux.conf.

# Status bar
set -g status-style "bg=#101215,fg=#d6d2c7"
set -g status-left-style "bg=#101215,fg=#d6d2c7"
set -g status-right-style "bg=#101215,fg=#838792"
set -g status-left "#[fg=#15171a,bg=#e1656c,bold] #S #[bg=#101215,fg=#d6d2c7] "
set -g status-right "#[fg=#e8965a]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#838792]#h "

# Window tabs
set -g window-status-style "bg=#101215,fg=#838792"
set -g window-status-current-style "bg=#1e2025,fg=#eae6dc,bold"
set -g window-status-activity-style "bg=#101215,fg=#dcbb6a"
set -g window-status-bell-style "bg=#101215,fg=#e07476,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[fg=#e1656c,bg=#1e2025,bold] #I:#W "

# Panes
set -g pane-border-style "fg=#262930"
set -g pane-active-border-style "fg=#e1656c"
set -g display-panes-colour "#838792"
set -g display-panes-active-colour "#e1656c"

# Messages, copy mode, clock, popups & menus
set -g message-style "bg=#1e2025,fg=#eae6dc"
set -g message-command-style "bg=#1e2025,fg=#dcbb6a"
set -g mode-style "bg=#2b2e35,fg=#eae6dc"
set -g copy-mode-match-style "bg=#dcbb6a,fg=#15171a"
set -g copy-mode-current-match-style "bg=#e1656c,fg=#15171a,bold"
set -g copy-mode-mark-style "bg=#e8965a,fg=#15171a"
set -g copy-mode-selection-style "bg=#2b2e35,fg=#eae6dc"
set -g clock-mode-colour "#e1656c"
set -g popup-style "bg=#101215,fg=#d6d2c7"
set -g popup-border-style "fg=#e1656c,bg=#101215"
set -g menu-style "bg=#101215,fg=#d6d2c7"
set -g menu-selected-style "bg=#2b2e35,fg=#eae6dc,bold"
set -g menu-border-style "fg=#838792,bg=#101215"
