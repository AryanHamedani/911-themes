# 911 (992.2) Precision Night Cockpit — tmux
# Race-Tex Charcoal (#141619), Ice Grey (#dadad6), Guards/Carmine Red (#e55c5a)
# Requires truecolor (24-bit RGB) support in your terminal / tmux.conf.

# Status bar chrome (Race-Tex chrome plane #131519)
set -g status-style "bg=#131519,fg=#dadad6"
set -g status-left-style "bg=#131519,fg=#dadad6"
set -g status-right-style "bg=#131519,fg=#858a96"
set -g status-left "#[fg=#f4f3ef,bg=#bf3b3e,bold] #S #[bg=#131519,fg=#dadad6] "
set -g status-right "#[fg=#e89158,bold]#{?pane_in_mode,COPY ,}#[fg=#e55c5a,bold]#{?client_prefix,PREFIX ,}#[fg=#6ac4cb,bold]#{?window_zoomed_flag,ZOOM ,}#[fg=#9297a2]#h #[fg=#858a96]%H:%M "

# Window tabs
set -g window-status-style "bg=#131519,fg=#858a96"
set -g window-status-current-style "bg=#1d2026,fg=#edede9,bold"
set -g window-status-last-style "bg=#131519,fg=#b4b7be"
set -g window-status-activity-style "bg=#282721,fg=#e0be66"
set -g window-status-bell-style "bg=#2a2124,fg=#e56c6a,bold"
set -g window-status-separator ""
set -g window-status-format " #[fg=#858a96]#I:#W "
set -g window-status-current-format "#[fg=#e55c5a,bg=#1d2026,bold] ▎#[fg=#edede9,bg=#1d2026,bold]#I:#W "

# Panes & split borders
set -g pane-border-style "fg=#252932"
set -g pane-active-border-style "fg=#e55c5a"
set -g pane-border-lines "single"
set -g display-panes-colour "#858a96"
set -g display-panes-active-colour "#e55c5a"

# Messages & command prompt
set -g message-style "bg=#1a1d23,fg=#edede9"
set -g message-command-style "bg=#1a1d23,fg=#e0be66"

# Copy mode, search & selection highlights
set -g mode-style "bg=#292d36,fg=#edede9"
set -g copy-mode-match-style "bg=#5b5134,fg=#edede9"
set -g copy-mode-current-match-style "bg=#bf3b3e,fg=#f4f3ef,bold"
set -g copy-mode-mark-style "bg=#261b1f,fg=#e89158,bold"
set -g copy-mode-selection-style "bg=#292d36,fg=#edede9"

# Clock mode
setw -g clock-mode-colour "#e55c5a"
setw -g clock-mode-style 24

# Popups & menus
set -g popup-style "bg=#0f1114,fg=#dadad6"
set -g popup-border-style "fg=#e55c5a,bg=#0f1114"
set -g popup-border-lines "rounded"
set -g menu-style "bg=#0f1114,fg=#dadad6"
set -g menu-selected-style "bg=#292d36,fg=#edede9,bold"
set -g menu-border-style "fg=#434854,bg=#0f1114"
set -g menu-border-lines "rounded"
