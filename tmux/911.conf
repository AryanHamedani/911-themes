# 911 (992.2) Precision Night Cockpit — tmux
# Race-Tex Charcoal (#141619), Ice Grey (#dadad6), Guards/Carmine Red (#e55c5a)
# Requires truecolor (24-bit RGB) support in your terminal / tmux.conf.

# Status bar chrome (Race-Tex chrome plane #131519)
set -g status-style "bg=#131519,fg=#dadad6"
set -g status-left-style "bg=#131519,fg=#dadad6"
set -g status-right-style "bg=#131519,fg=#9297a2"

# Session badge: Guards Red default (#bf3b3e/#f4f3ef), Racing Gold on prefix, Lava Orange in copy-mode
set -g status-left "#{?client_prefix,#[fg=#0a0b0d]#[bg=#e0be66]#[bold] #S ,#{?pane_in_mode,#[fg=#0a0b0d]#[bg=#e89158]#[bold] #S ,#[fg=#f4f3ef]#[bg=#bf3b3e]#[bold] #S }}#[fg=#dadad6]#[bg=#131519]#[nobold] "

# Telemetry & mode indicators (quiet at rest; crisp semantic pills only when active)
set -g status-right "#{?pane_in_mode,#[fg=#e89158]#[bg=#282721]#[bold] COPY #[bg=#131519]#[nobold] ,}#{?client_prefix,#[fg=#e0be66]#[bg=#282721]#[bold] PREFIX #[bg=#131519]#[nobold] ,}#{?pane_synchronized,#[fg=#f48583]#[bg=#2a2124]#[bold] SYNC #[bg=#131519]#[nobold] ,}#{?window_zoomed_flag,#[fg=#6ac4cb]#[bg=#1d272b]#[bold] ZOOM #[bg=#131519]#[nobold] ,}#[fg=#9297a2]#[bg=#131519]#h #[fg=#434854]#[bg=#131519]│ #[fg=#b4b7be]#[bg=#131519]%H:%M "

# Window tabs (calm inactive, brushed silver last, Smoked Carmine + Guards Red needle active)
set -g window-status-style "bg=#131519,fg=#858a96"
set -g window-status-last-style "bg=#131519,fg=#b4b7be"
set -g window-status-current-style "bg=#261b1f,fg=#edede9,bold"
set -g window-status-activity-style "bg=#282721,fg=#e0be66"
set -g window-status-bell-style "bg=#2a2124,fg=#f48583,bold"
set -g window-status-separator ""
set -g window-status-format " #I:#W#{?window_zoomed_flag, Z,}#{?window_bell_flag, !,}#{?window_activity_flag, ·,} "
set -g window-status-current-format "#[fg=#e55c5a]#[bg=#261b1f]#[bold]▎ #[fg=#edede9]#[bg=#261b1f]#[bold]#I:#W#{?window_zoomed_flag, #[fg=#6ac4cb]#[bg=#261b1f]Z,} "

# Panes & split borders (whisper-quiet #2f3440 hairline; Guards Red active focus)
set -g pane-border-style "fg=#2f3440"
set -g pane-active-border-style "fg=#e55c5a"
set -g pane-border-lines "single"
set -g pane-border-indicators "colour"
set -g pane-border-status "off"
set -g pane-border-format "#{?pane_active,#[fg=#e55c5a]#[bg=#131519]#[bold] ▎#P #[fg=#edede9]#[bg=#131519]#{pane_current_command} ,#[fg=#858a96]#[bg=#131519] #P #{pane_current_command} }"
set -g display-panes-colour "#9297a2"
set -g display-panes-active-colour "#e55c5a"
%if "#{>=:#{version},3.6}"
set -g display-panes-border-style "fg=#434854"
%endif

# Messages & command prompt (Vanadium elevated #1a1d23)
set -g message-style "bg=#1a1d23,fg=#edede9"
set -g message-command-style "bg=#1a1d23,fg=#e0be66,bold"
set -g prompt-cursor-colour "#e55c5a"
%if "#{>=:#{version},3.6}"
set -g prompt-command-cursor-colour "#e0be66"
%endif

# Copy mode, search & selection highlights (WCAG AA across every state)
set -g mode-style "bg=#292d36,fg=#edede9"
set -g copy-mode-selection-style "bg=#292d36,fg=#edede9"
set -g copy-mode-match-style "bg=#5b5134,fg=#edede9"
set -g copy-mode-current-match-style "bg=#bf3b3e,fg=#f4f3ef,bold"
set -g copy-mode-mark-style "bg=#261b1f,fg=#e89158,bold"
set -g copy-mode-position-style "bg=#363b47,fg=#f4f3ef,bold"
%if "#{>=:#{version},3.6}"
set -g copy-mode-current-line-style "bg=#1d2026"
set -g copy-mode-line-number-style "bg=#131519,fg=#858a96"
set -g copy-mode-current-line-number-style "bg=#1d2026,fg=#e55c5a,bold"
%endif

# Clock mode
setw -g clock-mode-colour "#e55c5a"
setw -g clock-mode-style 24

# Popups & menus (Vanadium elevated #1a1d23, crisp box border #434854, Smoked Carmine active item #261b1f)
set -g popup-style "bg=#1a1d23,fg=#dadad6"
set -g popup-border-style "fg=#434854,bg=#1a1d23"
set -g popup-border-lines "rounded"
set -g menu-style "bg=#1a1d23,fg=#dadad6"
set -g menu-selected-style "bg=#261b1f,fg=#edede9,bold"
set -g menu-border-style "fg=#434854,bg=#1a1d23"
set -g menu-border-lines "rounded"
