# 911 (992.2) Precision Night Cockpit theme for mpv
# Note: mpv 8-digit hex colors use #AARRGGBB (alpha first) and # values must be quoted.
# Note: osd-shadow-color / sub-shadow-color are aliases for osd-back-color / sub-back-color.

# Canvas & alpha checkerboard
background=color
background-color="#141619"
background-tile-color-0="#141619"
background-tile-color-1="#1d2026"
background-tile-size=16

# OSD (On-Screen Display, stats, console, playlist/select menus)
osd-color="#dadad6"
osd-back-color="#e60f1114"
osd-outline-color="#0a0b0d"
osd-border-style=background-box
osd-outline-size=0.8
osd-shadow-offset=4
osd-selected-color="#e55c5a"
osd-selected-outline-color="#0a0b0d"
osd-font="JetBrainsMono Nerd Font"
osd-font-size=28
osd-spacing=0.2
osd-margin-x=28
osd-margin-y=24
osd-duration=2000
osd-playing-msg="${media-title}"
osd-playing-msg-duration=2500

# OSD progress & volume bar (telemetry gauge)
osd-bar=yes
osd-bar-align-y=0.92
osd-bar-h=1.4
osd-bar-w=62
osd-bar-outline-size=1.0
osd-bar-marker-style=line
osd-bar-marker-scale=1.2
osd-bar-marker-min-size=1.5

# Subtitles (cinema-grade legibility without box intrusion)
sub-color="#edede9"
sub-outline-color="#0a0b0d"
sub-back-color="#990a0b0d"
sub-border-style=outline-and-shadow
sub-outline-size=2.0
sub-shadow-offset=1.5
sub-blur=0.3
sub-font="Inter"
sub-font-size=40
sub-bold=no
sub-spacing=0.1
sub-margin-x=48
sub-margin-y=36
sub-justify=center
sub-ass-override=scale
