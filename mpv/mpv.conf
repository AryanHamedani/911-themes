# 911 (992.2) Precision Night Cockpit theme for mpv
# Note: mpv 8-digit hex colors use #AARRGGBB (alpha first) and # values must be quoted.

# Canvas
background=color
background-color="#141619"

# OSD (On-Screen Display, stats, console, playlist/menu)
osd-color="#dadad6"
osd-back-color="#e00f1114"
osd-outline-color="#0a0b0d"
osd-shadow-color="#990a0b0d"
osd-shadow-offset=1.5
osd-border-style=outline-and-shadow
osd-outline-size=1.5
osd-selected-color="#e55c5a"
osd-selected-outline-color="#0a0b0d"
osd-font="JetBrainsMono Nerd Font"
osd-font-size=32
osd-margin-x=28
osd-margin-y=24

# OSD progress & volume bar
osd-bar=yes
osd-bar-align-y=0.92
osd-bar-h=1.8
osd-bar-w=64
osd-bar-outline-size=1.0
osd-playing-msg="${filename}"
osd-playing-msg-duration=2500

# Subtitles
sub-color="#edede9"
sub-back-color="#cc0f1114"
sub-outline-color="#0a0b0d"
sub-shadow-color="#990a0b0d"
sub-shadow-offset=1.5
sub-border-style=outline-and-shadow
sub-outline-size=2.0
sub-margin-y=36
