# Carrera v2.0.0 theme for mpv
# Note: mpv 8-digit hex colors use #AARRGGBB (alpha first) and # values must be quoted.

background=color
background-color="#15171a"

# OSD (On-Screen Display, stats, console, playlist/menu)
osd-color="#d6d2c7"
osd-back-color="#cc101215"
osd-outline-color="#0b0c0e"
osd-selected-color="#e1656c"
osd-selected-outline-color="#0b0c0e"
osd-border-style=outline-and-shadow

# Subtitles
sub-color="#eae6dc"
sub-back-color="#cc101215"
sub-outline-color="#0b0c0e"
sub-border-style=outline-and-shadow
