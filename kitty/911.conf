# 911 (992.2) Precision Night Cockpit — Kitty
# Race-Tex Charcoal (#141619), Ice Grey (#dadad6), Guards/Carmine Red (#e55c5a)
#
# ## name: 911
# ## author: Aryan Hamedani
# ## license: MIT
# ## blurb: Porsche 911 (992.2) Precision Night Cockpit dark theme calibrated in OKLCH to WCAG AA.

# Primary surfaces and typography (12.93:1 AAA)
foreground #dadad6
background #141619

# Selection — Slate Grey Neo surface with pure dial highlight (11.75:1 AAA)
selection_foreground #edede9
selection_background #292d36

# Cursor — Guards/Carmine Red needle (5.19:1 AA on canvas; 5.63:1 AA cursor text)
# Note: Omarchy's runtime template maps cursor to bright_foreground (#edede9).
cursor #e55c5a
cursor_text_color #0a0b0d

# URL highlight (Lugano Blue, 6.82:1 AA) and glare-free Smoked Carmine visual bell
url_color #6fa2de
visual_bell_color #261b1f

# Window borders and titlebar — crisp hairline hierarchy & Race-Tex chrome plane
active_border_color #e55c5a
inactive_border_color #252932
bell_border_color #e89158
wayland_titlebar_color #131519
macos_titlebar_color #131519

# Tab bar — Deep Carbon well (#0c0e11), Race-Tex inactive tabs (#131519, 6.24:1 AA),
# and filled Guards Red active tab badge (#bf3b3e / #f4f3ef, 4.84:1 AA)
tab_bar_background #0c0e11
tab_bar_margin_color #0a0b0d
active_tab_foreground #f4f3ef
active_tab_background #bf3b3e
active_tab_font_style bold
inactive_tab_foreground #9297a2
inactive_tab_background #131519
inactive_tab_font_style normal

# Marks — high-contrast deep diffuser ink (#0a0b0d) on calibrated semantic accents
# Mark 1: Lugano Blue (7.41:1 AAA) | Mark 2: PCCB Racing Gold (10.99:1 AAA) | Mark 3: Ultraviolet (6.88:1 AA)
mark1_foreground #0a0b0d
mark1_background #6fa2de
mark2_foreground #0a0b0d
mark2_background #e0be66
mark3_foreground #0a0b0d
mark3_background #b488cc

# Normal ANSI 0-7
color0 #141619
color1 #e56c6a
color2 #7fb887
color3 #e0be66
color4 #6fa2de
color5 #b488cc
color6 #6ac4cb
color7 #dadad6

# Bright ANSI 8-15
color8 #858a96
color9 #f48583
color10 #98ce9f
color11 #f0d282
color12 #8cb9f2
color13 #caa2e0
color14 #84d8de
color15 #edede9
